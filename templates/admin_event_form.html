{% extends "base.html" %}

{% block content %}
<section>
  <h2>{% if event %}Edit Event{% else %}Create Event{% endif %}</h2>

  <form method="post">
    <label for="title">Title:</label>
    <input type="text" id="title" name="title" value="{{ event.title if event else '' }}" required>

    <label for="short_description">Short description:</label>
    <input type="text" id="short_description" name="short_description"
      value="{{ event.short_description if event else '' }}" required>

    <label for="description">Description:</label>
    <textarea id="description" name="description" required>{{ event.description if event else '' }}</textarea>
    <label for="date">Date:</label>
    <input type="date" id="date" name="date" value="{{ event.date.strftime('%Y-%m-%d') if event else '' }}" required>

    <label for="time">Time:</label>
    <input type="time" id="time" name="time" value="{{ event.time.strftime('%H:%M') if event else '' }}" required>

    <label for="location">Location:</label>
    <input type="text" id="location" name="location" value="{{ event.location if event else '' }}" required>

    <label for="organizer">Organizer:</label>
    <input type="text" id="organizer" name="organizer" value="{{ event.organizer if event else '' }}" required>

    <label for="max_participants">Max participants:</label>
    <input type="number" id="max_participants" name="max_participants"
      value="{{ event.max_participants if event else 30 }}" min="1" required>

    <label for="category">Category:</label>
    <select id="category" name="category" required>
      {% for category in categories %}
      <option value="{{ category.id }}" {% if event and event.category.id==category.id %}selected{% endif %}>
        {{ category.name }}
      </option>
      {% endfor %}
    </select>

    <button type="submit">Save Event</button>
  </form>
</section>
{% endblock %}
